<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyber Car PRO MAX</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameCanvas {
            display: block;
            background: #0b0b1a;
            margin: 0 auto;
        }
        #lobbyScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0b1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            font-size: 26px;
            margin-bottom: 5px;
        }
        .stats {
            color: #a0a0c0;
            font-size: 14px;
            margin-bottom: 20px;
        }
        #startBtn {
            background: #ff007f;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            margin-bottom: 25px;
            transition: 0.2s;
        }
        #startBtn:active {
            transform: scale(0.95);
        }
        #garageGrid {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 400px;
        }
        .car-card {
            background: #161633;
            border: 2px solid #2a2a50;
            border-radius: 10px;
            padding: 10px;
            width: 90px;
            cursor: pointer;
            transition: 0.2s;
        }
        .car-card.selected {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
        .hud {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 14px;
            font-weight: bold;
            color: #00ffcc;
            pointer-events: none;
            z-index: 5;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 5;
        }
        .control-btn {
            background: rgba(22, 22, 51, 0.8);
            color: #a0a0c0;
            border: 2px solid #2a2a50;
            width: 100px;
            height: 60px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        #msgBox {
            color: #ff0055;
            font-size: 12px;
            height: 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- HUD -->
    <div class="hud">
        <div>Score: <span id="scoreVal">0</span></div>
        <div>High: <span id="highScoreVal">0</span></div>
        <div>Coins: <span id="coinVal">0</span></div>
    </div>

    <!-- Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Controls -->
    <div class="controls">
        <button id="leftBtn" class="control-btn">◀ LEFT</button>
        <button id="rightBtn" class="control-btn">RIGHT ▶</button>
    </div>

    <!-- Lobby Screen -->
    <div id="lobbyScreen">
        <h1>🚗 GARAGE LOBBY</h1>
        <div class="stats">Total Coins: <span id="lobbyCoins">0</span> | High Score: <span id="lobbyHighScore">0</span></div>
        
        <button id="startBtn">START GAME</button>
        
        <div id="garageGrid"></div>
        <div id="msgBox"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
