<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Runner PRO MAX</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        canvas {
            background: #222;
            display: block;
            margin: 20px auto;
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #ui {
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #ff6b81;
        }
    </style>
</head>
<body>

    <h1>Car Runner PRO MAX 🚗💨</h1>
    <div id="ui">
        <p id="user-status">Not Logged In</p>
        <button id="login-btn" onclick="loginWithGoogle()">Google Login</button>
    </div>

    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <!-- Firebase App (Core SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <!-- Firebase Authentication -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <!-- Firebase Firestore -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Google Login Function
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
            .then((result) => {
                console.log("Logged in as:", result.user.displayName);
            })
            .catch((error) => {
                console.error("Login Error:", error);
            });
        }

        // Track Auth State
        auth.onAuthStateChanged((user) => {
            const statusText = document.getElementById("user-status");
            const loginBtn = document.getElementById("login-btn");
            if (user) {
                statusText.innerText = `Welcome, ${user.displayName}`;
                loginBtn.style.display = "none";
            } else {
                statusText.innerText = "Not Logged In";
                loginBtn.style.display = "inline-block";
            }
        });

        // --- GAME LOGIC ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let car = { x: 175, y: 480, width: 50, height: 90, speed: 5 };
        let obstacles = [];
        let score = 0;
        let isGameOver = false;

        let keys = {};
        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        function spawnObstacle() {
            if (Math.random() < 0.02) {
                let lanes = [50, 150, 250, 300];
                let posX = lanes[Math.floor(Math.random() * lanes.length)];
                obstacles.push({ x: posX, y: -100, width: 50, height: 90, speed: 4 });
            }
        }

        function update() {
            if (isGameOver) return;

            // Car Movement
            if ((keys["ArrowLeft"] || keys["a"]) && car.x > 30) car.x -= car.speed;
            if ((keys["ArrowRight"] || keys["d"]) && car.x < canvas.width - 80) car.x += car.speed;

            spawnObstacle();

            // Obstacles Update
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed;

                // Collision Detection
                if (
                    car.x < obstacles[i].x + obstacles[i].width &&
                    car.x + car.width > obstacles[i].x &&
                    car.y < obstacles[i].y + obstacles[i].height &&
                    car.y + car.height > obstacles[i].y
                ) {
                    isGameOver = true;
                }

                // Remove out of screen
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                }
            }
        }

        function draw() {
            // Clear Screen
            ctx.fillStyle = "#222";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Road Lines
            ctx.strokeStyle = "#fff";
            ctx.setLineDash([20, 20]);
            ctx.beginPath();
            ctx.moveTo(133, 0); ctx.lineTo(133, canvas.height);
            ctx.moveTo(266, 0); ctx.lineTo(266, canvas.height);
            ctx.stroke();

            // Draw Player Car
            ctx.fillStyle = "#ff4757";
            ctx.fillRect(car.x, car.y, car.width, car.height);

            // Draw Obstacles
            ctx.fillStyle = "#2ed573";
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }

            // Draw Score
            ctx.fillStyle = "#fff";
            ctx.font = "20px Arial";
            ctx.fillText(`Score: ${score}`, 20, 30);

            if (isGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.font = "30px Arial";
                ctx.fillText("GAME OVER", 100, 280);
                ctx.font = "16px Arial";
                ctx.fillText("Refresh to Restart", 130, 320);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
