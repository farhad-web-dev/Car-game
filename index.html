<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Runner PRO MAX</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: #222;
            border: 4px solid #ff4757;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
        }
        #ui {
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="ui">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <!-- Firebase SDK aur Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBNgvXiRusRr9gdlyvws1vdb-nI9femsNg",
            authDomain: "car-game-121f0.firebaseapp.com",
            projectId: "car-game-121f0",
            storageBucket: "car-game-121f0.firebasestorage.app",
            messagingSenderId: "143804800312",
            appId: "1:143804800312:web:1db7245c0bdecf8b8af5cd",
            measurementId: "G-49TLFJ5XSC"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        console.log("Firebase connected successfully!");
    </script>

    <!-- Game Logic Script -->
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        let score = 0;
        let carY = 500;

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Simple moving car placeholder
            ctx.fillStyle = "#ff4757";
            ctx.fillRect(180, carY, 40, 70);

            score++;
            scoreElement.innerText = score;

            requestAnimationFrame(gameLoop);
        }

        // Tap to move car slightly
        window.addEventListener("click", () => {
            carY -= 20;
            if (carY < 400) carY = 500;
        });

        gameLoop();
    </script>
</body>
</html>
